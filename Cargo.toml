[package]
authors = ["darsvador"]
edition = "2024"
exclude = ["./test_config.toml"]
name = "v2ray-rust"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = []
strict-vmess-udp = []

[dependencies]
# [x] Asynchronous runtime
tokio = { version = "^1.47", features = ["net", "io-util", "macros", "sync"] }
tokio-util = { version = "^0.7", features = ["codec", "net"] }
futures-util = { version = "^0.3", default-features = false, features = [
    "sink",
    "std",
] }
async-trait = { version = "^0.1" }
spin = { version = "^0.10" }

# [x] Async server
actix-rt = { version = "^2.11" }
actix-server = { version = "^2.6" }
actix-service = { version = "^2.0" }

# [x] Security
sha-1 = { version = "^0.10" }
sha2 = { version = "^0.10" }
aead = { version = "^0.5" }
md-5 = { version = "^0.10" }
hkdf = { version = "^0.12" }
hmac = { version = "^0.12" }
aes = { version = "^0.8" }
aes-gcm = { version = "^0.10" }
chacha20poly1305 = { version = "^0.10" }
crc32fast = { version = "^1.3" }
# anyhow = "1.0"

# [x] Networking
tokio-boring = { version = "^4.19" }
tokio-tungstenite = { version = "^0.27", features = [
    "stream",
    "handshake",
], default-features = false }
socket2 = { version = "^0.6", features = ["all"] }
h2 = { version = "^0.4" }
http = { version = "^1.3" }
http-body-util = { version = "^0.1", features = ["full"] }
hyper = { version = "^1.7", features = ["full"] }
hyper-util = { version = "^0.1", features = [
    "tokio",
    "http1",
    "http2",
    "server",
    "client-legacy",
] }
tonic = { version = "^0.14" }
tonic-prost = { version = "^0.14" }
tower = { version = "^0.5" }
cidr-utils = { version = "^0.6" }
#cidr_matcher={git="https://github.com/Qv2ray/CIDRMatcher"}

# [x] Utils
gentian = { version = "^0.1" }
base64 = { version = "^0.22" }
bitvec = { version = "^1.0" }
bloomfilter = { version = "^3.0" }
boring = { version = "^4.19" }
boring-sys = { version = "^4.19" }
byte_string = { version = "^1.0" }
bytes = { version = "^1.10" }
foreign-types-shared = { version = "^0.3" }
prost = { version = "^0.14" }
protobuf = { version = "^3.7", features = ["with-bytes"] }
rand = { version = "^0.9", features = ["small_rng"] }
regex = { version = "^1.11" }
uuid = { version = "^1.18", features = ["std", "v4"] }
brotli = { version = "^8.0", features = ["ffi-api"] }
deepsize = { version = "^0.2" }

# [x] CLI & Logging
clap = { version = "^4.5" }
log = { version = "^0.4" }
env_logger = { version = "^0.11" }

# [x] Serialization
serde = { version = "^1.0", features = ["derive"] }
toml = { version = "^0.9" }

# [x] LibC
libc = { version = "^0.2" }


[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[build-dependencies]
protobuf-codegen = { version = "^3.7" }
tonic-prost-build = { version = "^0.14" }

[target.'cfg(windows)'.dependencies]
schannel = { version = "^0.1" }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
openssl-probe = { version = "^0.1" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "^3.5" }
