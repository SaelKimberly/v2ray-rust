[package]
authors = ["darsvador"]
edition = "2024"
exclude = ["./test_config.toml"]
name = "v2ray-rust"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = []
strict-vmess-udp = []

[dependencies]
# [x] Asynchronous runtime
tokio = { version = "1.26", features = ["net", "io-util", "macros", "sync"] }
tokio-util = { version = "0.7", features = ["codec", "net"] }
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }
async-trait = "0.1"
spin = "0.9.6"

# [x] Async server
actix-rt = "2.8"
actix-server = "2.2.0"
actix-service = "2.0"

# [x] Security
sha-1 = "0.10.1"
sha2 = "0.10.6"
aead = "0.5"
aes = "0.8.3"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
md-5 = "0.10.5"
hkdf = "0.12"
hmac = "0.12"
crc32fast = "1.3.2"
# anyhow = "1.0"

# [x] Networking
tokio-boring = "4.2.0"
tokio-tungstenite = { version = "0.20", features = [
    "stream",
    "handshake",
], default-features = false }
socket2 = { version = "0.4.7", features = ["all"] }
h2 = "0.3.20"
http = "0.2"
hyper = { version = "0.14.27", features = [
    "http1",
    "http2",
    "client",
    "server",
] }
tonic = "0.9"
tower = "0.4.13"
cidr-utils = "0.5.10"
#cidr_matcher={git="https://github.com/Qv2ray/CIDRMatcher"}
domain_matcher = { git = "https://github.com/darsvador/DomainMatcher", rev = "8df5a46746d90900d" }

# [x] Utils
gentian = "0.1.8"
base64 = "0.21.2"
bitvec = "1"
bloomfilter = "1.0.9"
boring = "4.2.0"
boring-sys = "4.2.0"
byte_string = "1.0"
bytes = "1"
foreign-types-shared = "0.3.1"
generic-array = "0.14.7"
prost = "0.11"
protobuf = { version = "3.0.1", features = ["with-bytes"] }
rand = { version = "0.8", features = ["small_rng"] }
regex = "1.7.3"
uuid = { version = "1.3", features = ["std", "v4"] }
brotli = "3.3.4"

# [x] CLI & Logging
clap = "4"
log = "0.4"
env_logger = "0.10"

# [x] Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.5"

# [x] to deprecate
once_cell = "1"

# [x] LibC
libc = "0.2"


[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[build-dependencies]
protobuf-codegen = "3.2.0"
tonic-build = "0.10"

[target.'cfg(windows)'.dependencies]
schannel = "0.1.21"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
openssl-probe = "0.1.5"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.9.1"
